{% extends "base.html" %}

{% block title %}
Contact – {{ site.site_name }}
{% endblock %}

{% block content %}

<section class="max-w-4xl mx-auto">

    <h2 class="text-4xl font-bold text-brand mb-8 text-center">
        Contact Us
    </h2>

    <!-- CONTACT DETAILS -->
    <div class="bg-white shadow rounded-xl p-8 mb-10">
        <p class="mb-4 text-lg">
            <strong>📍 Address:</strong><br>
            {{ site.address }}
        </p>

        <p class="mb-4 text-lg">
            <strong>📞 Phone:</strong><br>
            {{ site.phone_primary }}<br>
            {{ site.phone_secondary }}
        </p>

        <div class="flex gap-4 flex-wrap mt-6">
            <a href="tel:{{ site.phone_primary }}"
               class="bg-brand text-white px-6 py-3 rounded-lg font-semibold">
                📞 Call Now
            </a>

            <a href="https://wa.me/91{{ site.phone_primary }}?text=Hi%20Handsome%20Tailors,%20I%20need%20stitching%20details"
               class="bg-green-500 text-white px-6 py-3 rounded-lg font-semibold">
                💬 WhatsApp
            </a>
        </div>
    </div>

    <!-- GOOGLE MAP -->
    <div class="bg-white shadow rounded-xl p-4">
        <iframe
            src="https://www.google.com/maps?q=Handsome%20Tailors%20Arumbakkam%20Chennai&output=embed"
            width="100%"
            height="350"
            style="border:0;"
            allowfullscreen=""
            loading="lazy">
        </iframe>
    </div>

</section>

{% endblock %}
